<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Can I Take You Out? 💜</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Pacifico&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Poppins',sans-serif;
  height:100vh;
  background:linear-gradient(135deg,#FFB8FF,#9b5de5);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* ===== LOADER ===== */
#loader{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#9b5de5,#FFB8FF);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
  transition:.8s;
}
#loader.hidden{opacity:0;visibility:hidden}

.loader-bar-container{
  width:220px;height:10px;
  background:rgba(255,255,255,.3);
  border-radius:10px;
  overflow:hidden;
  margin-bottom:5px;
}
.loader-bar{
  height:100%;
  width:0;
  background:white;
  animation:load 3s forwards;
}
@keyframes load{to{width:100%}}

.loader-gif{
  width:200px;
  height: 200px;
  opacity:0;
  animation:show 0.6s forwards,pulse 1.2s;
  animation-delay:1s,1.3s;
  margin-bottom: 20px;
}
@keyframes show{to{opacity:1;transform:scale(1)}}
@keyframes pulse{50%{transform:scale(1.15)}}

.loader-text{
  margin-top:10px;
  color:white;
  font-weight:600;
  opacity:0;
  animation:fade .5s forwards;
  animation-delay:3s;
}
@keyframes fade{to{opacity:1}}

/* ===== CARD ===== */
.box{
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(15px);
  padding:30px 25px;
  border-radius:30px;
  width:100%;
  max-width:420px;
  text-align:center;
  box-shadow:0 15px 35px rgba(0,0,0,.25);
  opacity:0;
  transform:translateY(20px);
  transition:.8s;
}
.box.show{opacity:1;transform:translateY(0)}

h1{
  font-family:'Pacifico',cursive;
  color:white;
  font-size:2.4rem;
}
p{color:#f4f4f4;margin:10px 0 20px}

img{
  width:200px;height:200px;
  border-radius:20px;
  box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.buttons{
  position:relative;
  height:70px;
}
button{
  position:absolute;
  padding:14px 30px;
  border-radius:20px;
  border:none;
  font-weight:600;
  font-size:1.1rem;
  cursor:pointer;
}
#yesBtn{right:20px;background:white;color:#6a0dad}
#noBtn{left:20px;background:#3a0ca3;color:white}

#response{
  margin-top:20px;
  font-size:1.3rem;
  font-weight:bold;
  display:none;
  color:white;
}

/* ===== CONFETTI ===== */
.confetti{
  position:fixed;
  width:8px;
  height:14px;
  background:red;
  top:-20px;
  animation:fall 3s linear forwards;
}
@keyframes fall{
  to{transform:translateY(110vh) rotate(720deg)}
}

.meme-animate {
  animation: show 0.1s forwards, pulse 1.2s;
  
}

</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
  <img src="chiyong.gif" class="loader-gif">
  <div class="loader-bar-container"><div class="loader-bar"></div></div>
  
  <div class="loader-text">Loading…</div>
</div>

<!-- MAIN -->
<div class="box" id="mainBox">
  <h1>Can I take you out?</h1>
<br>
  <img id="meme" src="chaeyoung1.webp" class="meme-animate">
<br>
  <div class="buttons">
    <button id="noBtn">No</button>
    <button id="yesBtn">Yes</button>
  </div>

  <div id="response"></div>
</div>

<script>
const noBtn=document.getElementById("noBtn");
const yesBtn=document.getElementById("yesBtn");
const response=document.getElementById("response");
const meme=document.getElementById("meme");

let attempts=0;

// LOADER
window.addEventListener("load",()=>{
  setTimeout(()=>{
    loader.classList.add("hidden");
    mainBox.classList.add("show");
  },5000);
});

// CONFETTI
function confettiBurst(){
  for(let i=0;i<80;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=`hsl(${Math.random()*360},100%,70%)`;
    c.style.animationDuration=2+Math.random()*2+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4000);
  }
}

// YES
yesBtn.onclick = () => {
  response.style.display = "block";
  response.innerHTML = "I'll pick you up friday after class, we'll go to Typica, my treat.";
  meme.src = "chaeyoung7.jpg";

  // restart animation
  meme.classList.remove("meme-animate");
  void meme.offsetWidth; // forces reflow
  meme.classList.add("meme-animate");

  confettiBurst();
};

// NO RUNS
function moveNo(){
  const b=document.querySelector(".buttons");
  noBtn.style.left=Math.random()*(b.offsetWidth-noBtn.offsetWidth)+"px";
  noBtn.style.top=Math.random()*(b.offsetHeight-noBtn.offsetHeight)+"px";
}

function update(){
  response.style.display = "block";

  let newSrc = "";

  if (attempts === 3) {
    response.innerHTML = "Sure ka na ba?";
    newSrc = "chaeyoung5.jpg";
  }

  if (attempts === 6) {
    response.innerHTML = "May isa pang button 😭";
    newSrc = "chaeyoung6.jpg";
  }

  if (attempts === 9) {
    response.innerHTML = "Wala kang no choice 😌";
    newSrc = "chaeyoung8.jpg";
  }

  // Only animate if image actually changes
  if (newSrc) {
    meme.src = newSrc;

    // restart animation
    meme.classList.remove("meme-animate");
    void meme.offsetWidth; // force reflow
    meme.classList.add("meme-animate");
  }
}

noBtn.addEventListener("mouseenter",()=>{attempts++;moveNo();update()});
noBtn.addEventListener("touchstart",e=>{e.preventDefault();attempts++;moveNo();update()});
noBtn.onclick=e=>e.preventDefault();
</script>

</body>
</html>
